# Project identifiers
sonar.projectKey=my-php-app
sonar.projectName=My PHP Application
sonar.projectVersion=1.0

# Source settings
sonar.sources=.

# Language specific (optional, SonarQube auto-detects)
sonar.language=php

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude unwanted files (if needed)
# sonar.exclusions=**/vendor/**,**/node_modules/**

# PHP specific settings
sonar.php.file.suffixes=.php
#sonar.php.coverage.reportPaths=coverage.xml   # if you run PHPUnit coverage
#sonar.php.tests.reportPath=test-report.xml    # if you run phpunit tests

# Dockerfile (Sonar supports Docker via "Generic Plugin" or SonarLint rules)
sonar.inclusions=**/*.php,**/Dockerfile,**/*.sql,**/Jenkinsfile

# SQL
# SonarQube doesn’t analyze SQL deeply by default,
# but you can still include them for generic analysis.


