server:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: standard   # Change to your cluster's storage class
  retention: 7d              # Keep metrics for 7 days

alertmanager:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClass: standard

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true


serverFiles:
  rules:
    groups:
    - name: resource-alerts
      rules:
      - alert: HighCPUUsageWarning
        expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 70% on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.2f\" }}%. Investigate running processes."

      - alert: HighCPUUsageCritical
        expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage above 85% on {{ $labels.instance }}"
          description: "Critical CPU usage detected. Immediate action required."

      - alert: HighMemoryUsageWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 70% on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.2f\" }}%. Consider optimizing workloads."

      - alert: HighMemoryUsageCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 85% on {{ $labels.instance }}"
          description: "Critical memory usage detected. Possible OOM risk."

      - alert: HighDiskUsageWarning
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 70% on {{ $labels.instance }}"
          description: "Disk usage is {{ $value | printf \"%.2f\" }}%. Monitor storage growth."

      - alert: HighDiskUsageCritical
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"
          description: "Critical disk usage detected. Cleanup or scale storage immediately."

