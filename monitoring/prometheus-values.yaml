server:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: standard   # Change to your cluster's storage class
  retention: 7d              # Keep metrics for 7 days

alertmanager:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClass: standard

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

serverFiles:
  prometheus.yml:
    scrape_configs:
      # Scrape all kubelet metrics (cluster-wide)
      - job_name: 'kubernetes-nodes-kubelet'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:10250'
            target_label: __address__
          - source_labels: [__metrics_path__]
            target_label: metrics_path
            replacement: /metrics

      # Scrape node-exporter metrics from all nodes
      - job_name: 'prometheus-node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: prometheus-node-exporter
            action: keep

      # Scrape kube-state-metrics for all namespaces
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: prometheus-kube-state-metrics
            action: keep


  rules:
    groups:
      - name: resource-alerts
        rules:
          - alert: HighCPUUsageWarning
            expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CPU usage above 70% on {{ $labels.instance }}"
              description: "CPU usage is {{ $value | printf \"%.2f\" }}%. Investigate running processes."

          - alert: HighMemoryUsageWarning
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 70
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memory usage above 70% on {{ $labels.instance }}"
              description: "Memory usage is {{ $value | printf \"%.2f\" }}%. Consider optimizing workloads."

          - alert: HighDiskUsageWarning
            expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 70
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Disk usage above 70% on {{ $labels.instance }}"
              description: "Disk usage is {{ $value | printf \"%.2f\" }}%. Monitor storage growth."
